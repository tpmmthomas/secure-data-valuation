# CIFAR-10 Dataset Configuration
name: "cifar10"
data_dir: "./data/cifar10"
batch_size: 128
num_workers: 4
pin_memory: true
download: true
augmentation: true
normalize: true
validation_split: 0.0

# Dataset-specific parameters
image_size: 32
num_classes: 10

# Augmentation settings (when augmentation=true)
augmentation_params:
  random_crop:
    size: 32
    padding: 4
  random_horizontal_flip:
    probability: 0.5
  
# Normalization stats
normalization_stats:
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]
