# Student Models Configuration
cnn3:
  name: "cnn3"
  dropout: 0.2
  
  # Training parameters
  epochs: 15
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [8, 12]
    gamma: 0.1
  
  # Student-specific settings
  supervised_baseline: true
  supervised_epochs: 8

cnn5:
  name: "cnn5"
  dropout: 0.1
  epochs: 20
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [12, 16]
    gamma: 0.1
  supervised_baseline: true
  supervised_epochs: 10

cnn7:
  name: "cnn7"
  dropout: 0.2
  epochs: 25
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_params:
    T_max: 25
    eta_min: 0.001
  supervised_baseline: true
  supervised_epochs: 12

mobilenet_v2:
  name: "mobilenet_v2"
  dropout: 0.2
  epochs: 30
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_params:
    T_max: 30
    eta_min: 0.001
  model_params:
    width_mult: 1.0
  supervised_baseline: true
  supervised_epochs: 15

mobilenet_v3_small:
  name: "mobilenet_v3_small"
  dropout: 0.2
  epochs: 25
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  scheduler_params:
    T_max: 25
    eta_min: 0.0001
  model_params:
    variant: "small"
  supervised_baseline: true
  supervised_epochs: 12
