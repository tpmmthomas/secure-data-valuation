# ResNet Teacher Models Configuration
resnet18:
  name: "resnet18"
  pretrained: true
  dropout: 0.0
  
  # Training parameters
  epochs: 5
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [3, 4]
    gamma: 0.1
  
  # Model-specific parameters
  model_params:
    variant: "resnet18"
  
  # Teacher-specific settings
  freeze_features: false
  warmup_epochs: 0

resnet34:
  name: "resnet34"
  pretrained: true
  dropout: 0.0
  epochs: 8
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [5, 7]
    gamma: 0.1
  model_params:
    variant: "resnet34"

resnet50:
  name: "resnet50"
  pretrained: true
  dropout: 0.0
  epochs: 10
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_params:
    T_max: 10
    eta_min: 0.001
  model_params:
    variant: "resnet50"
