# CIFAR-10 Knowledge Distillation: ResNet18 Teacher -> CNN5 Student
experiment:
  name: "cifar10_resnet18_cnn5"
  seed: 42
  output_dir: "artifacts/cifar10_resnet18_cnn5"
  tags: ["cifar10", "resnet18", "cnn5", "baseline"]
  notes: "Baseline knowledge distillation experiment on CIFAR-10"

dataset:
  name: "cifar10"
  data_dir: "./data"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  download: true
  augmentation: true
  normalize: true
  validation_split: 0.0

teacher:
  name: "resnet18"
  pretrained: true
  epochs: 5
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [3, 4]
    gamma: 0.1
  freeze_features: false
  warmup_epochs: 0

student:
  name: "cnn5"
  epochs: 20
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [12, 16]
    gamma: 0.1
  dropout: 0.0
  supervised_baseline: true
  supervised_epochs: 1

distillation:
  alpha: 0.5
  temperature: 4.0
  loss_type: "kl_div"
  feature_distillation: false
  attention_distillation: false
  progressive_distillation: false

logging:
  log_interval: 100
  save_interval: 5
  eval_interval: 1
  use_tensorboard: true
  use_wandb: false
  wandb_project: "knowledge-distillation"
  log_gradients: false
  log_weights: false
  log_activations: false
