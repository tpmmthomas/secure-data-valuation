# Temperature Analysis Experiment
experiment:
  name: "temperature_analysis_cifar10"
  seed: 42
  output_dir: "artifacts/temperature_analysis"
  tags: ["cifar10", "temperature", "analysis"]
  notes: "Analyzing the effect of different temperatures on knowledge distillation"

dataset:
  name: "cifar10"
  data_dir: "./data"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  download: true
  augmentation: true
  normalize: true

teacher:
  name: "resnet18"
  pretrained: true
  epochs: 3
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [2]
    gamma: 0.1

student:
  name: "cnn5"
  epochs: 15
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "multistep"
  scheduler_params:
    milestones: [8, 12]
    gamma: 0.1
  dropout: 0.1
  supervised_baseline: false

distillation:
  alpha: 0.5
  temperature: 8.0  # Higher temperature for softer distributions
  loss_type: "kl_div"

logging:
  log_interval: 100
  save_interval: 5
  eval_interval: 1
  use_tensorboard: true
  use_wandb: false
