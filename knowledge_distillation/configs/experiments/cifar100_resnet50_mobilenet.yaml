# CIFAR-100 Knowledge Distillation: ResNet50 Teacher -> MobileNetV2 Student
experiment:
  name: "cifar100_resnet50_mobilenet"
  seed: 42
  output_dir: "artifacts/cifar100_resnet50_mobilenet"
  tags: ["cifar100", "resnet50", "mobilenet", "mobile"]
  notes: "Mobile-friendly knowledge distillation on CIFAR-100"

dataset:
  name: "cifar100"
  data_dir: "./data"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  download: true
  augmentation: true
  normalize: true
  validation_split: 0.1

teacher:
  name: "resnet50"
  pretrained: true
  epochs: 10
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_params:
    T_max: 10
    eta_min: 0.001

student:
  name: "mobilenet_v2"
  epochs: 30
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_params:
    T_max: 30
    eta_min: 0.001
  dropout: 0.2
  supervised_baseline: true
  supervised_epochs: 10

distillation:
  alpha: 0.3
  temperature: 6.0
  loss_type: "kl_div"
  feature_distillation: false
  attention_distillation: false

logging:
  log_interval: 50
  save_interval: 5
  eval_interval: 2
  use_tensorboard: true
  use_wandb: false
